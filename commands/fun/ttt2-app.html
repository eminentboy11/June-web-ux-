<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;background:transparent;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
body{padding:4px}.card{width:268px;margin:0;padding:12px;border-radius:18px;background:linear-gradient(160deg,#041f22 0%,#062e33 55%,#021417 100%);color:#d7fbf6;box-shadow:0 8px 24px #0009;border:1px solid #0e6e63;text-align:center}
h1{margin:0 0 2px;font-size:17px;letter-spacing:.5px;background:linear-gradient(90deg,#2dd4bf,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 10px;font-size:11px;color:#7fc7bc}
#b{width:216px;height:216px;margin:0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border-radius:14px;background:#06272b;border:1px solid #0e5f57;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;cursor:pointer;box-shadow:inset 0 2px 8px #0006}
.cell:active{background:#0a3d38}
.cell.x{color:#2dd4bf}.cell.o{color:#fbbf24}
.cell.win{background:#0e5f57;box-shadow:0 0 16px #2dd4b788}
.st{min-height:20px;margin:10px 0 6px;font-size:13px;color:#a7e8de;font-weight:600}
.btns{display:flex;gap:10px;justify-content:center}
.b{flex:0 0 46%;padding:11px 0;font-size:14px;font-weight:700;border:0;border-radius:12px;cursor:pointer}
.b.you{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#04262b}
.b.bot{background:linear-gradient(135deg,#fbbf24,#d97706);color:#2b1a02}
.b:active{transform:scale(.98)}
.hint{margin:8px 0 0;font-size:10px;color:#5da99d}
.score{display:flex;justify-content:center;gap:14px;margin:4px 0 8px;font-size:11px;color:#7fc7bc}
.score b{color:#d7fbf6}
</style></head><body><div class="card">
<h1>⭕❌ TIC-TAC-TOE</h1>
<p class="sub">you are ❎ · bot is 🟡 · beat the unbeatable 😏</p>
<div class="score">You <b id="sw">0</b> · Draws <b id="sd">0</b> · Bot <b id="sl">0</b></div>
<div id="b"></div>
<p class="st" id="st">Pick a mode to start 👇</p>
<div class="btns">
<button class="b you" id="py">You first</button>
<button class="b bot" id="pb">Bot first</button>
</div>
<p class="hint">tap a square to play · mode buttons restart</p>
</div><script>
(function(){
'use strict';
var board,over,turn,human='X',bot='O',started=false;
var wins=0,draws=0,losses=0;
var cells=[];
var bEl=document.getElementById('b'),stEl=document.getElementById('st');
for(var i=0;i<9;i++){(function(idx){
 var d=document.createElement('div');d.className='cell';d.onclick=function(){play(idx)};
 bEl.appendChild(d);cells.push(d);})(i);}
function LINES(){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];}
function winnerOf(b){for(var i=0;i<LINES().length;i++){var l=LINES()[i];
 if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return{p:b[l[0]],line:l};}
 for(var j=0;j<9;j++)if(!b[j])return null;
 return{p:'draw',line:[]};}
function minimax(b,isBot){
 var w=winnerOf(b);
 if(w){if(w.p===bot)return{s:10,d:0};if(w.p===human)return{s:-10,d:0};return{s:0,d:0};}
 var best={s:isBot?-99:99,d:-1};
 for(var i=0;i<9;i++){
  if(b[i])continue;
  b[i]=isBot?bot:human;
  var r=minimax(b,!isBot);r.d=i;
  b[i]=null;
  if(isBot?r.s>best.s:r.s<best.s)best=r;
 }
 return best;
}
function botMove(){
 if(over||!started)return;
 var m=minimax(board.slice(),true).d;
 if(m>=0&&m<9&&board[m]==null){board[m]=bot;render();}
 finish();
 turn=human;
}
function play(idx){
 if(over||!started||board[idx]||turn!==human)return;
 board[idx]=human;render();finish();
 if(!over){turn=bot;stEl.textContent='🤖 bot is thinking…';setTimeout(botMove,420);}
}
function finish(){
 var w=winnerOf(board);
 if(w){over=true;
  w.line.forEach(function(i){cells[i].className=cells[i].className+' win'});
  if(w.p==='draw'){draws++;stEl.textContent='🤝 Draw! Rematch?';}
  else if(w.p===human){wins++;stEl.textContent='🎉 You win! (screenshot this)';}
  else{losses++;stEl.textContent='🤖 Bot wins — as foretold 😌';}
  document.getElementById('sw').textContent=wins;
  document.getElementById('sd').textContent=draws;
  document.getElementById('sl').textContent=losses;
 }
}
function render(){
 for(var i=0;i<9;i++){
  var v=board[i];
  cells[i].className='cell'+(v===human?' x':v===bot?' o':'')+(over&&winnerOf(board)&&winnerOf(board).line.indexOf(i)>=0?' win':'');
  cells[i].textContent=v==='X'?'✖':v==='O'?'◉':'';
 }
}
function start(first){
 board=new Array(9).fill(null);over=false;started=true;turn=first;render();
 stEl.textContent=first===human?'Your move — you are ✖':'🤖 bot is thinking…';
 if(first===bot)setTimeout(botMove,420);
}
document.getElementById('py').onclick=function(){start(human)};
document.getElementById('pb').onclick=function(){start(bot)};
window.__test={winnerOf:winnerOf,minimax:minimax,state:function(){return{board:board,over:over,turn:turn,started:started}},
 counters:function(){return{wins:wins,draws:draws,losses:losses}}};
})();
</script></body></html>
