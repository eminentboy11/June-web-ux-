<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;background:transparent;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
body{padding:4px}.card{width:268px;margin:0;padding:12px;border-radius:18px;background:linear-gradient(160deg,#12061f 0%,#1f0836 55%,#0d0219 100%);color:#f3e8ff;box-shadow:0 8px 24px #0009;border:1px solid #4a1d7a;text-align:center}
h1{margin:0 0 2px;font-size:17px;letter-spacing:.5px;background:linear-gradient(90deg,#c084fc,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 12px;font-size:11px;color:#b78bd9}
.wheelWrap{position:relative;width:216px;height:216px;margin:0 14px}
#wheel{width:216px;height:216px;border-radius:50%;display:block;box-shadow:0 0 0 5px #2a1150,0 0 30px #7c3aed66;transition:transform 4s cubic-bezier(.12,.6,.09,1)}
#pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:24px;filter:drop-shadow(0 2px 3px #000a);z-index:2}
.hub{position:absolute;top:50%;left:50%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#a855f7,#4c1d95);border:3px solid #c084fc;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 18px #a855f788;z-index:2}
.res{min-height:110px;margin:12px 0 4px;border-radius:14px;border:1px solid #4a1d7a;background:#160a29;padding:10px 12px;display:none;text-align:left}
.res.show{display:block}
.res .tag{font-size:12px;font-weight:800;letter-spacing:1px}
.res .tag.t{color:#22d3ee}.res .tag.d{color:#f472b6}
.res .txt{font-size:13px;color:#f3e8ff;margin-top:5px;line-height:1.45}
.btns{display:flex;gap:10px;justify-content:center;margin-top:6px}
.spin{flex:1;padding:13px 0;font-size:15px;font-weight:800;letter-spacing:.5px;border:0;border-radius:14px;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;cursor:pointer;box-shadow:0 4px 16px #a855f755}
.spin:active{transform:scale(.98)}
.hint{margin:9px 0 0;font-size:10px;color:#8b6bb1}
</style></head><body><div class="card">
<h1>🎲 TRUTH OR DARE</h1>
<p class="sub">tap the wheel — fate decides 😈</p>
<div class="wheelWrap">
<div id="pointer">▼</div>
<canvas id="wheel" width="432" height="432"></canvas>
<div class="hub">🎯</div>
</div>
<div class="res" id="res"><div class="tag" id="tag"></div><div class="txt" id="txt"></div></div>
<div class="btns"><button class="spin" id="spin">SPIN 🎡</button></div>
<p class="hint">Truth 💙 or Dare 💗 — play nice!</p>
</div><script>
(function(){
'use strict';
var TRUTHS=[
 "What's the most embarrassing thing you've ever posted online?",
 "Who was your first crush — and are they in this chat? 😏",
 "What's a lie you told that you never got caught for?",
 "What's the pettiest reason you ever stopped talking to someone?",
 "Show the last 5 photos in your gallery (no skipping!).",
 "What's the most childish thing you still do?",
 "What's the biggest secret you've kept from your parents?",
 "Who in this chat would you trade lives with for a day, and why?",
 "What's the weirdest thing you've done when nobody was watching?",
 "What's the most useless talent you have?",
 "What's the longest you've gone without sleeping, and why?",
 "If you had to delete one app forever (not WhatsApp), which one?",
 "What's the worst gift you ever received — and did they know?",
 "What nickname do you secretly hate being called?",
 "What's something everyone does that you think is weird?",
 "Have you ever stalked someone's profile for hours? Whose? 👀",
 "What's the most trouble you got into at school?",
 "What's one thing you'd do if nobody would ever find out?",
 "What's the last thing you searched that you'd hate people to see?",
 "Who here would you pick as your partner in crime? 🦹"
];
var DARES=[
 "Send the 5th photo in your gallery — no explanation. 📸",
 "Type the last message you sent, word for word, to this chat.",
 "Do 10 squats right now. Film it if you're brave. 🏋️",
 "Speak only in questions for the next 3 rounds.",
 "Let the person to your left post on your status. 📱",
 "Send a voice note singing the chorus of your favourite song. 🎤",
 "Change your profile picture to whatever the chat picks for 1 hour.",
 "Text your crush 'we need to talk' — then say 'my phone is acting up'. 😈",
 "Talk in a dramatic movie-trailer voice for the next 2 minutes. 🎬",
 "Do your best animal impression — the chat votes if it passes. 🐐",
 "Reveal your screen time report for today. ⏰",
 "Say the alphabet backwards in one breath — or do 5 push-ups. 💪",
 "Let someone rename you in this chat for the rest of the game. 🏷️",
 "Send a selfie with the ugliest filter you can find. 🤳",
 "Dance with no music for 20 seconds. Record it. 💃",
 "Copy the funniest message from this chat and send it as yours.",
 "Tell an embarrassing story about yourself in a voice note. 🎙️",
 "Act like a robot for the next 3 messages. 🤖 Beep boop.",
 "Say something nice about the person who spun before you. 🥰",
 "Post 'I love jollof rice' on your status and leave it for 30 mins. 🍚"
];
var W=document.getElementById('wheel'),ctx=W.getContext('2d'),resEl=document.getElementById('res'),tagEl=document.getElementById('tag'),txtEl=document.getElementById('txt');
var sectors=[
 {label:'TRUTH',color:'#0891b2',type:'t'},{label:'DARE',color:'#db2777',type:'d'},
 {label:'TRUTH',color:'#0e7490',type:'t'},{label:'DARE',color:'#be185d',type:'d'},
 {label:'TRUTH',color:'#06b6d4',type:'t'},{label:'DARE',color:'#ec4899',type:'d'},
 {label:'TRUTH',color:'#155e75',type:'t'},{label:'DARE',color:'#9d174d',type:'d'}
];
var SIZE=432,CX=216,CY=216,R=210,arc=(Math.PI*2)/sectors.length;
function drawWheel(){
 ctx.clearRect(0,0,SIZE,SIZE);
 for(var i=0;i<sectors.length;i++){
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,arc*i,arc*(i+1));ctx.closePath();
  ctx.fillStyle=sectors[i].color;ctx.fill();
  ctx.strokeStyle='#12061f';ctx.lineWidth=3;ctx.stroke();
  ctx.save();ctx.translate(CX,CY);ctx.rotate(arc*i+arc/2);
  ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 26px Arial';
  ctx.fillText(sectors[i].label,R-16,9);ctx.restore();
 }
 ctx.beginPath();ctx.arc(CX,CY,R-3,0,Math.PI*2);ctx.strokeStyle='#c084fc';ctx.lineWidth=5;ctx.stroke();
}
var rot=0,spinning=false;
function pick(list){return list[Math.floor(Math.random()*list.length)];}
function spin(){
 if(spinning)return;spinning=true;
 resEl.className='res';
 var extra=(Math.random()<0.5?360:720)+Math.floor(Math.random()*360);
 rot+=extra;
 W.style.transform='rotate('+rot+'deg)';
 var final=((rot%360)+360)%360;
 var pointerDeg=(360-final+90)%360;
 var idx=Math.floor(pointerDeg/45)%sectors.length;
 var sec=sectors[idx];
 setTimeout(function(){
  spinning=false;
  var line=sec.type==='t'?pick(TRUTHS):pick(DARES);
  tagEl.className='tag '+sec.type;
  tagEl.textContent=sec.type==='t'?'💙 TRUTH':'💗 DARE';
  txtEl.textContent=line;
  resEl.className='res show';
 },4100);
}
document.getElementById('spin').onclick=spin;
window.__test={pick:pick,sectors:sectors,truths:TRUTHS,dares:DARES,state:function(){return{rot:rot,spinning:spinning}}};
drawWheel();
})();
</script></body></html>
