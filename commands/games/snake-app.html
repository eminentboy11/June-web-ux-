<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;background:transparent;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
body{padding:10px}.card{max-width:310px;margin:0 auto;padding:12px;border-radius:16px;background:#0a0616;color:#e6ddff;box-shadow:0 6px 18px #000a,0 0 24px #7c3aed33;border:1px solid #3b1e78;text-align:center}
h1{margin:0 0 4px;font-size:17px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#c084fc,#818cf8,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px #a855f755}
.status{margin:0 0 8px;min-height:15px;color:#c4b5fd;font-size:12px}
.board-wrap{display:flex;justify-content:center;width:100%}
#c{width:240px;height:240px;display:block;border:1px solid #6d28d9;border-radius:8px;background:#0d0620;touch-action:none;box-shadow:0 0 14px #7c3aed44 inset}

/* GAMEPAD D-PAD */
.dpad{
  position:relative;
  width:178px;
  height:158px;
  margin:14px auto 0;
  filter:drop-shadow(0 7px 8px #0009);
}

.dpad button{
  position:absolute;
  margin:0;
  padding:0;
  width:58px;
  height:58px;
  border:1px solid #5b3b91;
  color:#ddd2ff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(145deg,#3b2167,#21103d);
  box-shadow:
    inset 0 2px 2px #ffffff12,
    inset 0 -5px 7px #0008,
    0 4px 0 #160a2b,
    0 5px 8px #0008;
  transition:transform .06s,box-shadow .06s,background .06s;
  z-index:2;
}

.dpad button:active{
  transform:translateY(3px);
  background:linear-gradient(145deg,#4c2a80,#28134b);
  box-shadow:
    inset 0 2px 3px #ffffff10,
    inset 0 -2px 4px #0008,
    0 1px 0 #160a2b,
    0 2px 4px #0008;
}

/* UP */
.dp-up{
  left:60px;
  top:0;
  border-radius:14px 14px 7px 7px!important;
}

/* LEFT */
.dp-left{
  left:0;
  top:50px;
  border-radius:14px 7px 7px 14px!important;
}

/* RIGHT */
.dp-right{
  right:0;
  top:50px;
  border-radius:7px 14px 14px 7px!important;
}

/* DOWN */
.dp-down{
  left:60px;
  bottom:0;
  border-radius:7px 7px 14px 14px!important;
}

/* CENTER RESTART */
.dp-mid{
  left:60px;
  top:50px;
  width:58px!important;
  height:58px!important;
  border-radius:50%!important;
  z-index:3!important;
  background:radial-gradient(circle at 38% 32%,#6941a1,#351b61 65%,#21103d)!important;
  font-size:17px!important;
}

.dp-mid:active{
  background:radial-gradient(circle at 38% 32%,#8054bd,#452371 65%,#291346)!important;
}

.hint{margin:8px 0 0;font-size:11px;color:#8b7bb8}
</style></head><body><div class="card">
<h1>🐍 SNAKE</h1>
<p class="status" id="st">Tap a control to start</p>
<div class="board-wrap"><canvas id="c" width="240" height="240"></canvas></div>

<div class="dpad">
<button id="bu" class="dp-up">▲</button>
<button id="bl" class="dp-left">◀</button>
<button id="rs" class="dp-mid">⟳</button>
<button id="br" class="dp-right">▶</button>
<button id="bd" class="dp-down">▼</button>
</div>

<p class="hint">Swipe the board or use arrow keys · eat 🍎, don't bite yourself</p>
</div><script>
(function(){
'use strict';
var N=15, CELL=16, cv=document.getElementById('c'), ctx=cv.getContext('2d'), st=document.getElementById('st');
var snake, dir, pend, food, score, best=0, over, started, timer=null;
var START_SPEED=340, MIN_SPEED=55, SPEED_STEP=16, speed;

function reset(){
  snake=[{x:7,y:8},{x:6,y:8},{x:5,y:8}];
  dir={x:1,y:0};
  pend=null;
  score=0;
  over=false;
  started=false;
  speed=START_SPEED;
  placeFood();
  draw();
}

function placeFood(){
  do{
    food={
      x:Math.floor(Math.random()*N),
      y:Math.floor(Math.random()*N)
    };
  }while(snake.some(function(s){
    return s.x===food.x&&s.y===food.y
  }));
}

function turn(x,y){
  if(over){
    reset();
    started=true;
    loop();
    return;
  }

  if(!started){
    started=true;
    loop();
  }

  if(pend)return;
  if(dir.x===-x&&dir.y===-y)return;
  pend={x:x,y:y};
}

function step(){
  if(!started||over)return;

  if(pend){
    dir=pend;
    pend=null;
  }

  var h={
    x:snake[0].x+dir.x,
    y:snake[0].y+dir.y
  };

  if(
    h.x<0||
    h.y<0||
    h.x>=N||
    h.y>=N||
    snake.some(function(s){
      return s.x===h.x&&s.y===h.y
    })
  ){
    over=true;
    best=Math.max(best,score);

    st.textContent='💀 Game over — score '+score+
      (score>=best&&score>0?' (best!)':'')+
      ' · tap a control to retry';

    draw();
    return;
  }

  snake.unshift(h);

  if(h.x===food.x&&h.y===food.y){
    score+=10;
    st.textContent='Score: '+score+' · best: '+best;
    placeFood();
    speed=Math.max(MIN_SPEED,speed-SPEED_STEP);
    loop();
  }else{
    snake.pop();
  }

  draw();
}

function draw(){
  ctx.fillStyle='#0d0620';
  ctx.fillRect(0,0,240,240);

  ctx.fillStyle='#8b5cf6';

  for(var i=0;i<snake.length;i++){
    ctx.fillRect(
      snake[i].x*CELL+1,
      snake[i].y*CELL+1,
      CELL-2,
      CELL-2
    );
  }

  ctx.fillStyle='#e8574f';
  ctx.fillRect(
    food.x*CELL+2,
    food.y*CELL+2,
    CELL-4,
    CELL-4
  );

  if(over){
    ctx.fillStyle='rgba(13,6,32,.55)';
    ctx.fillRect(0,0,240,240);
  }
}

function loop(){
  if(timer)clearInterval(timer);
  timer=setInterval(step,speed);
}

document.getElementById('bl').onclick=function(){
  turn(-1,0)
};

document.getElementById('br').onclick=function(){
  turn(1,0)
};

document.getElementById('bu').onclick=function(){
  turn(0,-1)
};

document.getElementById('bd').onclick=function(){
  turn(0,1)
};

document.getElementById('rs').onclick=function(){
  reset();
  started=true;
  loop();
};

var tx=0,ty=0;

cv.addEventListener('touchstart',function(e){
  tx=e.touches[0].clientX;
  ty=e.touches[0].clientY;
},{passive:true});

cv.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tx,
      dy=e.changedTouches[0].clientY-ty;

  if(Math.abs(dx)<12&&Math.abs(dy)<12)return;

  if(Math.abs(dx)>Math.abs(dy))
    turn(dx>0?1:-1,0);
  else
    turn(0,dy>0?1:-1);

},{passive:true});

document.onkeydown=function(e){
  if(e.key==='ArrowLeft')turn(-1,0);
  if(e.key==='ArrowRight')turn(1,0);
  if(e.key==='ArrowUp')turn(0,-1);
  if(e.key==='ArrowDown')turn(0,1);
};

window.__test={
  turn:turn,
  step:step,
  reset:reset,
  state:function(){
    return{
      snake:snake,
      dir:dir,
      food:food,
      score:score,
      over:over,
      started:started,
      speed:speed
    }
  }
};

reset();

})();
</script></body></html>
