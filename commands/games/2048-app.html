<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;width:100%;background:transparent;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
body{padding:10px}.card{max-width:310px;margin:0 auto;padding:12px;border-radius:16px;background:#0d0b08;color:#f5e9d3;box-shadow:0 6px 18px #0008;border:1px solid #3b2f12;text-align:center}
h1{margin:0 0 4px;font-size:16px;color:#f2b134}.status{margin:0 0 8px;min-height:15px;color:#cbb27f;font-size:12px}
#g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:246px;margin:auto;background:#1c1608;border:1px solid #6b5217;border-radius:8px;padding:6px;touch-action:none}
.t{height:54px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:#241c0b;color:#4a3b18}
.t2{background:#3c3226;color:#f5e9d3}.t4{background:#4a3d26;color:#f5e9d3}.t8{background:#8a6420;color:#fff}.t16{background:#a97a1e;color:#fff}
.t32{background:#c98a1c;color:#fff}.t64{background:#e09a17;color:#fff}.t128{background:#f2b134;color:#3b2f12;font-size:16px}
.t256{background:#f6c453;color:#3b2f12;font-size:16px}.t512{background:#fad97f;color:#3b2f12;font-size:16px}
.t1024,.t2048{background:#ffe9b0;color:#3b2f12;font-size:14px}.tsuper{background:#fff;color:#3b2f12;font-size:13px}
.row{display:flex;gap:8px;justify-content:center;margin-top:10px}
button{flex:1;max-width:64px;padding:10px 0;font-size:15px;border:0;border-radius:10px;background:#3b2f12;color:#f5e9d3;cursor:pointer}
button:active{background:#6b5217}.wide{max-width:none;flex:0 0 60%}
.hint{margin:8px 0 0;font-size:11px;color:#a08b5c}
</style></head><body><div class="card">
<h1>🔢 2048</h1>
<p class="status" id="st">Swipe or use arrow keys · merge to 2048!</p>
<div id="g"></div>
<div class="row"><button class="wide" id="rs">New Game</button></div>
<p class="hint">Swipe the board · same numbers merge · reach 2048</p>
</div><script>
(function(){
'use strict';
var G=document.getElementById('g'),st=document.getElementById('st'),cells=[],board,score,over,won;
for(var i=0;i<16;i++){var d=document.createElement('div');d.className='t';G.appendChild(d);cells.push(d);}
function empty(b){var r=[];for(var i=0;i<16;i++)if(!b[i])r.push(i);return r;}
function spawn(b){var e=empty(b);if(!e.length)return;b[e[Math.floor(Math.random()*e.length)]]=Math.random()<0.9?2:4;}
function rowLine(b,r){return [b[r*4],b[r*4+1],b[r*4+2],b[r*4+3]];}
function setLine(b,r,l){for(var i=0;i<4;i++)b[r*4+i]=l[i];}
function colLine(b,c){return [b[c],b[c+4],b[c+8],b[c+12]];}
function setCol(b,c,l){for(var i=0;i<4;i++)b[c+4*i]=l[i];}
function merge(l){var a=l.filter(function(v){return v}),out=[],moved=0;
 for(var i=0;i<a.length;i++){if(a[i]===a[i+1]){out.push(a[i]*2);score+=a[i]*2;if(a[i]*2===2048)won=true;i++;}else out.push(a[i]);}
 while(out.length<4)out.push(0);
 for(i=0;i<4;i++)if(out[i]!==l[i])moved=1;return{l:out,m:moved};}
function slide(b,dir){var moved=0;
 for(var k=0;k<4;k++){var line=dir==='l'||dir==='r'?rowLine(b,k):colLine(b,k);
  if(dir==='r'||dir==='d')line.reverse();
  var r=merge(line);if(dir==='r'||dir==='d')r.l.reverse();
  if(dir==='l'||dir==='r')setLine(b,k,r.l);else setCol(b,k,r.l);
  moved=moved||r.m;}
 return moved;}
function canMove(b){if(empty(b).length)return true;
 for(var r=0;r<4;r++){var l=rowLine(b,r);for(var i=0;i<3;i++)if(l[i]&&l[i]===l[i+1])return true;}
 for(var c=0;c<4;c++){var l3=colLine(b,c);for(var t=0;t<3;t++)if(l3[t]&&l3[t]===l3[t+1])return true;}
 return false;}
function render(){for(var i=0;i<16;i++){var v=board[i];cells[i].textContent=v||'';
 cells[i].className='t'+(v?(v<=2048?' t'+v:' tsuper'):'');}
 st.textContent='Score: '+score+(won?' · 🎉 2048! keep going':'')+(over?' · no moves left':'');}
function move(dir){if(over)return;var before=board.slice();
 if(slide(board,dir)){spawn(board);render();}
 if(!canMove(board)){over=true;render();}}
function reset(){board=new Array(16).fill(0);score=0;over=false;won=false;spawn(board);spawn(board);render();}
document.getElementById('rs').onclick=reset;
var tx=0,ty=0;G.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
G.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)<12&&Math.abs(dy)<12)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'r':'l');else move(dy>0?'d':'u');},{passive:true});
document.onkeydown=function(e){if(e.key==='ArrowLeft')move('l');if(e.key==='ArrowRight')move('r');if(e.key==='ArrowUp')move('u');if(e.key==='ArrowDown')move('d');};
window.__test={slide:slide,merge:merge,canMove:canMove,spawn:spawn,move:move,state:function(){return{board:board,score:score,over:over,won:won}}};
reset();
})();
</script></body></html>
