name: Build and Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Obfuscate source
        run: npm run build

      - name: Checkout Repo B
        uses: actions/checkout@v4
        with:
          repository: eminentboy11/Test
          token: ${{ secrets.REPO_B_TOKEN }}
          path: repo-b

      - name: Replace Repo B with obfuscated build
        run: |
          find repo-b -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "June x on/." repo-b/

      - name: Push to Repo B
        run: |
          cd repo-b

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update obfuscated build"
            git push
          fi
